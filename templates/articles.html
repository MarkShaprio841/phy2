<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Celery</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>The Celery</h1>
        <nav>
            <ul>
                <li><a href="{{ url_for('home') }}">Home</a></li>
                <li><a href="{{ url_for('full_index') }}">Full Content Index</a></li>
                <li><a href="{{ url_for('upload_file') }}">Upload New Article</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="articles">
            <h2>Articles</h2>
            <ul>
                {% for article in articles %}
                    <li>
                        <a href="{{ url_for('uploaded_file', filename=article.filename) }}">
                            <h3>{{ article.filename }}</h3>
                            <p>{{ article.preview }}</p>
                        </a>
                    </li>
                {% endfor %}
            </ul>
        </section>
        <section class="upload">
            <a href="{{ url_for('upload_file') }}">Upload New Article</a>
        </section>
    </main>
</body>
</html>
